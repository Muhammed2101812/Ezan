<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="38%" cy="26%" r="92%">
      <stop offset="0%" stop-color="#241E55"/>
      <stop offset="42%" stop-color="#0E0B22"/>
      <stop offset="100%" stop-color="#040308"/>
    </radialGradient>
    <linearGradient id="amberGrad" gradientUnits="userSpaceOnUse" x1="118" y1="118" x2="394" y2="394">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="28%" stop-color="#FCD34D"/>
      <stop offset="62%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.40"/>
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hubGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="55%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
  </defs>

  <!-- Squircle background: violet-tinged slate to near-black -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>
  <!-- Faint rim light for premium edge definition -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>

  <!-- Soft amber halo behind the dial (depth + moonlight feel) -->
  <circle cx="256" cy="232" r="180" fill="url(#glowGrad)"/>

  <!-- Crescent-shaped clock dial: 270° arc, opening at bottom -->
  <path d="M 156 356 A 142 142 0 1 1 356 356"
        fill="none" stroke="url(#amberGrad)" stroke-width="44" stroke-linecap="round"/>

  <!-- Single hand pointing to ~1 o'clock (time + Qibla pointer) -->
  <line x1="256" y1="256" x2="314" y2="174"
        stroke="url(#amberGrad)" stroke-width="20" stroke-linecap="round"/>

  <!-- Center hub with specular highlight -->
  <circle cx="256" cy="256" r="18" fill="url(#hubGrad)"/>
  <circle cx="250" cy="250" r="6" fill="#FFFBEB" fill-opacity="0.75"/>
</svg>
